<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知乎问答关系图谱 · 观点地图 Demo</title>
<script src="assets/echarts.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1b2230; --line:#263041;
  --txt:#e6edf3; --dim:#8b96a5; --accent:#2f81f7;
  --authority:#4a9eff; --normal:#8b96a5; --org:#f0883e; --gem:#ffd24a;
  --dispute:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{padding:12px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel)}
header h1{font-size:16px;font-weight:600;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.searchbar{flex:1;min-width:260px;max-width:520px;display:flex;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.searchbar select{flex:1;background:transparent;border:0;color:var(--txt);
  padding:8px 11px;font-size:13px;outline:none;cursor:pointer}
.searchbar select option{background:var(--panel2)}
.searchbar button{background:var(--accent);border:0;color:#fff;padding:0 18px;
  cursor:pointer;font-size:13px;font-weight:500}
.meta-badge{font-size:11px;color:var(--dim);border:1px solid var(--line);
  padding:3px 9px;border-radius:20px;white-space:nowrap}

main{flex:1;display:flex;min-height:0}
#side{width:252px;border-right:1px solid var(--line);background:var(--panel);
  padding:14px;overflow-y:auto;flex-shrink:0}
#side h3{font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:1px;margin:16px 0 8px}
#side h3:first-child{margin-top:0}

.filter{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;
  background:var(--panel2);border:1px solid transparent;border-radius:6px;
  cursor:pointer;font-size:13px;transition:.15s}
.filter:hover{border-color:var(--line)}
.filter.on{background:rgba(47,129,247,.14);border-color:var(--accent)}
.filter .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.filter .n{margin-left:auto;color:var(--dim);font-size:11px}

.clu{padding:8px 9px;margin-bottom:5px;background:var(--panel2);
  border-left:3px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px}
.clu:hover{background:#202836}
.clu.off{opacity:.35}
.clu b{display:block;font-size:12.5px;margin-bottom:2px}
.clu i{color:var(--dim);font-style:normal;font-size:11px}

.gemitem{padding:7px 9px;margin-bottom:5px;background:rgba(255,210,74,.07);
  border:1px solid rgba(255,210,74,.3);border-radius:5px;cursor:pointer;font-size:12px}
.gemitem:hover{background:rgba(255,210,74,.14)}
.gemitem b{display:block}
.gemitem i{color:var(--dim);font-style:normal;font-size:11px}

#center{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#viewtabs{display:flex;gap:2px;padding:8px 14px 0}
.tab{padding:6px 15px;font-size:12.5px;color:var(--dim);cursor:pointer;
  border-radius:6px 6px 0 0;border:1px solid transparent}
.tab.on{color:var(--txt);background:var(--panel);border-color:var(--line);border-bottom-color:transparent}
#chart{flex:1;min-height:0}
#listview{flex:1;overflow-y:auto;padding:12px 16px;display:none}
.row{padding:11px 13px;margin-bottom:8px;background:var(--panel);
  border:1px solid var(--line);border-left-width:3px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.gem{border-left-color:var(--gem)}
.row .t{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.row .t b{font-size:13.5px}
.row .t .tag{font-size:10.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.row .g{color:var(--dim);font-size:12.5px}

.legend{position:absolute;left:14px;bottom:14px;background:rgba(21,27,36,.94);
  border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:11px;
  line-height:1.9;pointer-events:none;max-width:235px}
.legend b{font-size:11px;color:var(--dim);letter-spacing:.5px}
.legend .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.axis-hint{position:absolute;right:14px;top:52px;background:rgba(21,27,36,.94);
  border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:11px;
  color:var(--dim);pointer-events:none;max-width:200px}
.axis-hint em{color:var(--accent);font-style:normal}

#drawer{width:0;background:var(--panel);border-left:1px solid var(--line);
  overflow:hidden;transition:width .22s;flex-shrink:0}
#drawer.open{width:356px}
.dw{padding:16px;overflow-y:auto;height:100%}
.dw .close{float:right;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
.dw h2{font-size:15.5px;margin-bottom:3px;padding-right:22px}
.dw .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.chip{font-size:11px;padding:3px 9px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.chip.hi{color:var(--gem);border-color:rgba(255,210,74,.45)}
.dimbar{margin-bottom:9px}
.dimbar .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:3px}
.dimbar .track{height:5px;background:var(--panel2);border-radius:3px;position:relative}
.dimbar .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dimbar .track .fill{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.dw .body{font-size:13px;line-height:1.85;color:#c9d4e0;
  border-top:1px solid var(--line);padding-top:12px;white-space:pre-wrap}
.dw .cmp{display:grid;grid-template-columns:1fr;gap:10px}
.cmpcard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px}
.cmpcard.a{border-left:3px solid var(--authority)}
.cmpcard.b{border-left:3px solid var(--dispute)}
.cmpcard b{font-size:13px}
.cmpcard p{font-size:12.3px;color:#c0cbd8;margin-top:5px;line-height:1.75}
.disclaimer{margin-top:14px;padding:9px 11px;background:rgba(240,136,62,.08);
  border:1px solid rgba(240,136,62,.3);border-radius:6px;font-size:11px;
  color:#d8b08c;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>知乎问答关系图谱 · <span>观点地图</span></h1>
  <div class="searchbar">
    <select id="qsel"></select>
    <button id="go">生成地图</button>
  </div>
  <div class="meta-badge" id="stat">—</div>
  <div class="meta-badge" id="srcbadge">—</div>
</header>

<main>
  <aside id="side">
    <h3>身份属性</h3>
    <div id="f-badge"></div>
    <h3>质量滤镜</h3>
    <div id="f-qual"></div>
    <h3>观点簇（点击隐藏/显示）</h3>
    <div id="f-clu"></div>
    <h3>被低估的回答</h3>
    <div id="gems"></div>
  </aside>

  <section id="center">
    <div id="viewtabs">
      <div class="tab on" data-v="graph">图谱视图</div>
      <div class="tab" data-v="list">列表视图（兜底）</div>
    </div>
    <div id="chart"></div>
    <div id="listview"></div>
    <div class="legend" id="legend"></div>
    <div class="axis-hint" id="axishint"></div>
  </section>

  <aside id="drawer"><div class="dw" id="dw"></div></aside>
</main>

<script src="app.js"></script>
</body>
</html>
